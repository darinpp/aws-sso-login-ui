name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Build
        run: |
          go build -o aws-sso-login-ui .
          chmod +x aws-sso-login-ui

      - name: Package
        run: zip aws-sso-login-ui-macos-arm64.zip aws-sso-login-ui

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: aws-sso-login-ui-macos-arm64.zip
          generate_release_notes: true
